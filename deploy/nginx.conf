# nginx site for Harmony, for servers that already run nginx.
# Replace harmony.example.com with your own subdomain, then get a certificate
# with: certbot --nginx -d <your subdomain>
# (certbot adds the listen 443 and certificate lines to this file.)

map $http_upgrade $harmony_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name harmony.example.com;

    client_max_body_size 25m;

    # Voice call signalling goes to LiveKit (see docs/voice.md).
    location /rtc {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $harmony_connection_upgrade;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets for live updates.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $harmony_connection_upgrade;
        proxy_read_timeout 1h;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
