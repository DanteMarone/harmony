[package]
name = "harmony-crypto"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
js-sys = "0.3.107"
openmls = { version = "0.9.2", features = ["js"] }
openmls_basic_credential = "0.6.0"
openmls_memory_storage = "0.6.0"
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"
tls_codec = "0.5.0"
wasm-bindgen = "=0.2.130"

[lib]
crate-type = ["cdylib", "rlib"]

# The browser has no operating-system random source; these features make the
# `getrandom` crates use the browser's `crypto.getRandomValues` instead.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

# Small and fast WebAssembly output.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
