[package]
name = "harmony-crypto"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
aes-gcm = "0.10.3"
ed25519-dalek = "2.2.0"
getrandom = "0.2.17"
hkdf = "0.12.4"
js-sys = "0.3.107"
openmls = { version = "0.9.2", features = ["js"] }
openmls_basic_credential = "0.6.0"
openmls_memory_storage = "0.6.0"
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"
sha2 = "0.10.9"
tls_codec = "0.5.0"
wasm-bindgen = "=0.2.130"

[lib]
crate-type = ["cdylib", "rlib"]

# The browser has no operating-system random source; these features make the
# `getrandom` crates use the browser's `crypto.getRandomValues` instead.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }

# Small and fast WebAssembly output.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
